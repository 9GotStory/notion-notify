<!--
  หน้าดูตารางงาน (ปฏิทินการปฏิบัติงานจาก Notion) — mobile first
  โหมดสองระดับ: สาธารณะ (มีลิงก์ก็ดูได้ — เห็นงาน/เวลา/สถานที่)
  กับเจ้าหน้าที่ (เข้าสู่ระบบผ่าน LINE และลงทะเบียนแล้ว — เห็นผู้รับผิดชอบ/รายละเอียด/หมายเหตุ
  และผู้ลา (ใบอนุมัติแล้ว) เพิ่ม — ชื่อบุคลากรเป็นข้อมูลภายในจึงไม่ส่งให้โหมดสาธารณะ)

  ใช้ทรัพย์กรรมชุดเดียวกับฟอร์มลา (web/liff-form/): Tailwind คอมไพล์ + LIFF SDK same-origin
  ส่วน LIFF ของหน้านี้เป็น "แอป LIFF ตัวที่สอง" (endpoint /schedule/) — ถ้ายังไม่ได้สร้าง
  (ค่าว่าง) หน้าจะทำงานแบบสาธารณะล้วนไปก่อน ไม่พัง
-->

<link rel="stylesheet" href="../liff-form/styles.css">

<script src="../shared/date.js"></script>

<!-- GitHub Actions แทนที่ placeholder ก่อน deploy ด้วยค่าจาก Environment "liff"
     (SCHEDULE_LIFF_ID เป็นตัวเลือก — ว่าง = โหมดสาธารณะล้วน, API_URL ต้องมี) -->
<script>
  const CONFIG = {

    API_URL: '__API_URL__',
  };

<body class="font-sans bg-canvas text-slate-900 text-[15px] leading-relaxed">

<div class="max-w-lg mx-auto min-h-screen px-4 pt-6 pb-10">

  <!-- ===== ส่วนหัว ===== -->
  <header class="text-center mb-5">
    <img src="../liff-form/logo.png" alt="ตราสัญลักษณ์สำนักงานสาธารณสุขอำเภอสอง"
         class="w-14 h-14 mx-auto mb-2 object-contain"
         onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
    <div id="logoFallback" style="display:none"
         class="w-14 h-14 rounded-full bg-primary text-white items-center justify-center mx-auto mb-2 shadow-sm">
      <span class="text-sm font-bold tracking-wide">สสอ.</span>
    </div>
    <h1 class="text-lg font-bold">ตารางงาน</h1>
    <p class="text-sm text-slate-500 mt-0.5">สำนักงานสาธารณสุขอำเภอสอง จังหวัดแพร่</p>
    <p id="modeBadge" class="inline-block mt-2 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">กำลังเปิด…</p>
  </header>

  <!-- แถบเชิญเจ้าหน้าที่ล็อกอิน (โชว์เฉพาะมุมมองทั่วไปที่มี LIFF ให้ใช้) -->
  <div id="loginCta" class="ui-alert ui-alert-info hidden mb-4">
    <p class="text-sky-800">เจ้าหน้าที่ที่เข้าสู่ระบบด้วย LINE จะเห็นผู้รับผิดชอบ รายละเอียด และผู้ลาเพิ่มเติม</p>
    <button id="btnLogin" type="button" class="ui-btn-primary mt-2 w-full sm:w-auto">เข้าสู่ระบบด้วย LINE</button>
  </div>

  <!-- ===== เลือกเดือน ===== -->
  <nav class="ui-card flex items-center justify-between px-3 py-2.5 mb-4" aria-label="เลือกเดือน">
    <button id="btnPrev" type="button" aria-label="เดือนก่อนหน้า" class="w-11 h-11 rounded-full hover:bg-slate-100 text-slate-600 text-lg font-bold disabled:opacity-30 disabled:hover:bg-transparent focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand">‹</button>
    <div class="relative flex items-center">
      <button id="btnMonth" type="button" aria-haspopup="true" aria-expanded="false"
              class="rounded-control px-2 py-1 font-bold focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand">
        <span id="monthLabel">—</span> <span aria-hidden="true" class="text-slate-400 text-xs">▾</span>
      </button>
      <button id="btnRefresh" type="button" aria-label="รีเฟรชตารางงาน"
              class="w-11 h-11 rounded-full hover:bg-slate-100 text-slate-500 text-lg font-bold disabled:opacity-30 disabled:hover:bg-transparent focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand">⟳</button>
      <!-- รายการเดือนที่ระบบให้ดู: ย้อน 1 ถึงล่วงหน้า 6 เดือน (เจ้าหน้าที่ ±12) ตามวงที่เซิร์ฟเวอร์ส่งมา -->
      <div id="monthPicker" class="hidden absolute left-1/2 -translate-x-1/2 top-full mt-2 z-20 w-60 max-h-[60vh] overflow-y-auto ui-card p-1.5" aria-label="เลือกเดือน"></div>
    </div>
    <button id="btnNext" type="button" aria-label="เดือนถัดไป" class="w-11 h-11 rounded-full hover:bg-slate-100 text-slate-600 text-lg font-bold disabled:opacity-30 disabled:hover:bg-transparent focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand">›</button>
  </nav>

  <!-- ===== ปฏิทินย่อของเดือนที่ดู — จุดบอกวันที่มีรายการ แตะวันที่เพื่อเลื่อนลิสต์ไปหา ===== -->
  <div id="miniCal" class="ui-card p-3 mb-4"></div>

  <!-- ===== กรองงานของฉัน (โชว์เฉพาะโหมดเจ้าหน้าที่ที่รู้ชื่อผู้ดู) ===== -->
  <div id="mineBar" class="hidden mb-3">
    <button id="btnMine" type="button" aria-pressed="false" class="ui-btn-soft w-full">เฉพาะงานที่ฉันรับผิดชอบ</button>
  </div>

  <!-- ===== รายการ ===== -->
  <section id="viewList"></section>

  <!-- สถานะกำลังโหลด/ผิดพลาด (ถูกย้ายเข้า viewList ตอน render) -->
  <div id="viewLoading" class="py-16 text-center text-slate-500">
    <div class="w-7 h-7 border-[3px] border-primary border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
    กำลังโหลดตารางงาน…
  </div>
  <div id="viewError" class="hidden py-16 text-center">
    <div class="text-3xl mb-3">😟</div>
    <p id="errorMessage" class="text-red-700 font-medium mb-5 px-4"></p>
    <button id="btnRetry" type="button" class="ui-btn-primary">ลองใหม่</button>
  </div>

</div>

<script>
(function () {
  'use strict';

  const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
    'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const THAI_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const THAI_DAYS_SHORT = ['อา','จ','อ','พ','พฤ','ศ','ส']; // หัวคอลัมน์ของปฏิทินย่อ

  // วงเดือนเริ่มต้นแบบโหมดสาธารณะ — ใช้ก่อน response แรกถึงเท่านั้น หลังจากนั้นเซิร์ฟเวอร์ส่งวงจริง
  // ของโหมดนั้นๆ มากับทุก response (viewMonths — เจ้าหน้าที่กว้างกว่า) แล้ว state.viewMonths เป็นตัวชี้ขาด
  const MONTH_BACK = -1;
  const MONTH_FWD = 6;

  const state = {
    month: '',        // 'YYYY-MM' ที่กำลังดู
    today: '',        // 'yyyy-MM-dd' ตามเวลาท้องถิ่น
    cache: {},        // เก็บผลต่อเดือน เลื่อนไป-กลับไม่ต้องดึงซ้ำ
    viewMonths: null, // วงเดือนที่ดูได้ {back, fwd} ตามโหมด — null = ยังไม่มี response ใช้ค่าเริ่มต้นสาธารณะ
    deadToken: '',    // token ที่เซิร์ฟเวอร์ปฏิเสธไปแล้ว — ห้ามส่งซ้ำจนกว่า liff จะออกค่าใหม่ (ต่างค่า) มา
    full: false,      // โหมดเจ้าหน้าที่ (เห็นครบทุกฟิลด์)
    viewer: '',       // ชื่อต้นของผู้ดูจากเซิร์ฟเวอร์ (เฉพาะโหมดเจ้าหน้าที่) — ใช้กรองงานของตัวเอง
    mine: false,      // เปิดกรองเฉพาะงานที่ตัวเองรับผิดชอบ (+ใบลาของตัวเอง)
    liffReady: false, // มี LIFF แอปของหน้านี้ให้ใช้
  };

  function $(id) { return document.getElementById(id); }

  function pad(n) { return String(n).padStart(2, '0'); }
  // "วันนี้" ต้องอิดเวลาไทยเสมอ (ตารางเป็นของสำนักงานในไทย) — ผู้ใช้เปิดจากต่างประเทศต้องไม่เห็น
  // ป้ายวันนี้/ขอบเขตเดือนเพี้ยน ใช้ Intl แบบเดียวกับ bangkokYearMonth_ ฝั่ง admin (reports.js)
  function todayStr() {
    const parts = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Bangkok', year: 'numeric', month: 'numeric', day: 'numeric',
    }).formatToParts(new Date()).forEach(p => { parts[p.type] = p.value; });
    return parts.year + '-' + pad(Number(parts.month)) + '-' + pad(Number(parts.day));
  }
  function todayMonth() { return todayStr().slice(0, 7); }
  function shiftMonth(month, delta) {
    const [y, m] = month.split('-').map(Number);
    const total = y * 12 + (m - 1) + delta;
    return Math.floor(total / 12) + '-' + pad((total % 12) + 1);
  }
  function monthDiff(from, to) {
    const [fy, fm] = from.split('-').map(Number);
    const [ty, tm] = to.split('-').map(Number);
    return (ty - fy) * 12 + (tm - fm);
  }
  function monthLabel(month) {
    const [y, m] = month.split('-').map(Number);
    return THAI_MONTHS[m - 1] + ' ' + (y + 543);
  }
  function dayLabel(dateStr) {
    const dow = new Date(dateStr + 'T00:00:00').getDay();
    return 'วัน' + THAI_DAYS[dow] + ' · ' + ThaiDate.format(dateStr);
  }
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // งานนี้เกี่ยวกับผู้ดูไหม: ชื่อตรงกับหนึ่งในผู้รับผิดชอบ หรือเป็นงานของ "ทุกคน"
  // (แนติกเดียวกับ assigneeMatches_ ฝั่งเซิร์ฟเวอร์ — แถวงานส่งชื่อมาคั่นลูกน้ำแล้ว)
  function isMine(item) {
    const names = (item.assignees || '').split(',').map(s => s.trim());
    return names.indexOf(state.viewer) !== -1 || names.indexOf('ทุกคน') !== -1;
  }

  // ---------- อ่านตารางจาก Apps Script โดยตรง ----------

  // LIFF access token อายุ 12 ชั่วโมงและออกให้ตอน init (เอกสาร LINE) — อ่านใหม่จาก liff ทุกครั้งที่จะยิง
  // ไม่จำสตริงไว้ตั้งแต่ boot ไม่งั้นแท็บที่เปิดค้างนานจะส่ง token หมดอายุวนไปเรื่อยๆ
  // คืน '' เมื่อยังไม่พร้อม/ไม่ได้ล็อกอิน หรือเป็น token ที่เซิร์ฟเวอร์ปฏิเสธไปแล้ว (state.deadToken)
  // ถ้า liff ออกค่าใหม่มาให้เอง (ต่างจากตัวที่ตาย) ก็ส่งค่าใหม่นั้น — เข้าโหมดเจ้าหน้าที่กลับเอง
  function currentToken() {
    if (!state.liffReady) return '';
    try {
      if (!(typeof liff.isLoggedIn === 'function' && liff.isLoggedIn())) return '';
      const token = liff.getAccessToken() || '';
      return token && token !== state.deadToken ? token : '';
    } catch (err) { return ''; }
  }

  // cache ฝั่งหน้าเว็บแยกตามโหมดที่ใช้ยิง (มี/ไม่มี token) เหมือน cache key ฝั่งเซิร์ฟเวอร์
  // กันข้อมูลเต็มโหมดค้างปนตอน token ตายกลางทางแล้วสลับเดือนไป-กลับ (badge สลับมุมมองมั่วๆ)
  function cacheKey(month) {
    return month + (currentToken() ? '_full' : '_pub');
  }

  async function fetchMonth(month) {
    const key = cacheKey(month);
    if (state.cache[key]) return state.cache[key];
    const token = currentToken(); // token ของคำขอนี้ — ใช้เทียบตอนเซิร์ฟเวอร์ปฏิเสธด้านล่าง
    let res;
    const controller = new AbortController();
    const timeout = setTimeout(function () { controller.abort(); }, 20000);
    try {
      // POST แบบ text/plain = "simple request" ไม่เกิด CORS preflight (Apps Script ตอบ OPTIONS ไม่ได้)
      // และย้ายข้อมูลทั้งหมดรวมถึง accessToken ออกจาก URL — URL พกข้อมูลรับรองไม่ได้ (ติด log/ถูกส่งต่อ)
      res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign(
          { apiAction: 'schedule', month: month }, token ? { accessToken: token } : {})),
        signal: controller.signal,
      });
    } catch (err) {
      throw new Error(err && err.name === 'AbortError'
        ? 'ระบบใช้เวลาตอบกลับนานเกินไป กรุณาลองอีกครั้ง'
        : 'เชื่อมต่อระบบไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง');
    } finally {
      clearTimeout(timeout);
    }
    let data = null;
    try { data = await res.json(); } catch (err) { /* ตกไปที่ข้อความ error ด้านล่าง */ }
    if (!res.ok || !data || data.ok === false) {
      throw new Error((data && data.error) || 'เชื่อมต่อระบบไม่สำเร็จ ลองอีกครั้ง');
    }
    // ส่ง token ไปแต่เซิร์ฟเวอร์ตอบกลับเป็นสาธารณะ = token นี้ตายแล้ว — จำไว้ไม่ส่งซ้ำ
    // ให้ทั้งหน้า (cache key/viewer/badge) เปลี่ยนเป็นสาธารณะอย่างเดียวสมบูรณ์ ไม่สลับกระพริบ
    // (ถ้า liff ออก token ใหม่ให้ภายหลัง currentToken จะส่งค่าใหม่นั้น แล้วกลับสู่โหมดเจ้าหน้าที่เอง)
    if (token && data.full === false) state.deadToken = token;
    state.cache[cacheKey(month)] = data; // เก็บใต้ key ของโหมด "หลัง" ปฏิเสธ token — ตรงกับที่จะค้นครั้งหน้า
    return data;
  }

  // ---------- render ----------

  function showStatus(which) {
    $('viewLoading').classList.toggle('hidden', which !== 'loading');
    $('viewError').classList.toggle('hidden', which !== 'error');
    // ซ่อนรายการเดิมตอนโหลด/ผิดพลาด — กันเนื้อหาเดือนเก่าค้างปนกับสถานะใหม่ให้สับสน
    $('viewList').classList.toggle('hidden', which !== 'none');
    if (which === 'none') $('viewList').innerHTML = '';
  }

  // วงเดือนที่ใช้จริง — จากเซิร์ฟเวอร์ตามโหมด หรือ fallback ค่าสาธารณะก่อน response แรกถึง
  function viewBounds() {
    return state.viewMonths || { back: MONTH_BACK, fwd: MONTH_FWD };
  }

  // สถานะปุ่มนำทาง: ปิดทุกปุ่มระหว่างโหลด (กันกดซ้อน — กดเลือกเดือนใหม่ระหว่างโหลดเดิม
  // แล้ว response ช้าของเดือนเก่ามาทับ render ทีหลังได้) และปิดปุ่มที่ชนขอบเขตเดือนอยู่แล้ว
  function updateNavState(loading) {
    const bounds = viewBounds();
    const atOldest = monthDiff(todayMonth(), state.month) <= bounds.back;
    const atNewest = monthDiff(todayMonth(), state.month) >= bounds.fwd;
    $('btnPrev').disabled = loading || atOldest;
    $('btnNext').disabled = loading || atNewest;
    $('btnMonth').disabled = loading;
    $('btnRefresh').disabled = loading;
  }

  // การ์ดผู้ลา (มุมมองเจ้าหน้าที่เท่านั้น) — โทนอำพันแยกจากการ์ดงานทันทีที่เห็น
  // รูปแบบเดียวกับ itemCard: หัวเรื่อง + แถวย่อย (ช่วงวันที่ของใบหลายวัน / ครึ่งวัน)
  function leaveCard(row) {
    const rows = [];
    if (row.range) rows.push(['ช่วงวันที่', row.range]); // ลาหลายวัน — บอกช่วงเต็มของใบนี้ทุกวันที่คร่อม
    if (row.period) rows.push(['ช่วงวัน', row.period]);
    const subRows = rows.map(r =>
      '<div class="flex items-baseline gap-2 mt-1"><span class="text-xs font-semibold text-amber-700 shrink-0">' +
      escapeHtml(r[0]) + ':</span><span class="text-xs text-amber-800 min-w-0">' + escapeHtml(r[1]) + '</span></div>'
    ).join('');
    return (
      '<div class="ui-card border-amber-200 bg-warning-soft p-4 mt-2">' +
        '<div class="flex items-baseline gap-2">' +
          '<span class="text-xs font-bold text-amber-700 shrink-0">🏖️ ลา</span>' +
          '<span class="text-sm font-bold text-slate-800 min-w-0">' + escapeHtml(row.name) + ' — ' + escapeHtml(row.type) + '</span>' +
        '</div>' + subRows +
      '</div>'
    );
  }

  function itemCard(item) {
    if (item.isBirthday) {
      return (
        '<div class="ui-card border-pink-200 bg-pink-50 p-4 mt-2">' +
          '<div class="flex items-baseline gap-2">' +
            '<span class="text-xs font-bold text-pink-500 shrink-0">🎉</span>' +
            '<span class="text-sm font-bold text-slate-800 min-w-0">' + escapeHtml(item.title) + '</span>' +
          '</div>' +
          (state.full && item.details ? '<div class="mt-1 text-xs font-medium text-pink-700">' + escapeHtml(item.details) + '</div>' : '') +
        '</div>'
      );
    }

    const rows = [];
    if (item.range) rows.push(['ช่วงวันที่', item.range]); // งานหลายวัน — บอกช่วงเต็มของรายการนี้
    if (state.full && item.assignees) rows.push(['ผู้รับผิดชอบ', item.assignees]);
    if (item.location) rows.push(['สถานที่', item.location]);
    if (state.full && item.details) rows.push(['รายละเอียด', item.details]);
    if (state.full && item.notes) rows.push(['หมายเหตุ', item.notes]);
    const subRows = rows.map(r =>
      '<div class="flex items-baseline gap-2 mt-1"><span class="text-xs font-semibold text-slate-500 shrink-0">' +
      escapeHtml(r[0]) + ':</span><span class="text-xs text-slate-600 min-w-0">' + escapeHtml(r[1]) + '</span></div>'
    ).join('');
    // ผู้รับผิดชอบกำลังลา — แยกบล็อกโทนอำพันให้เห็นเด่นกว่าแถวย่อยปกติ (มีเฉพาะมุมมองเจ้าหน้าที่)
    const onLeaveNote = (state.full && item.assigneesOnLeave && item.assigneesOnLeave.length)
      ? '<div class="mt-2 text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-1.5">⚠ ผู้รับผิดชอบกำลังลา: ' +
          escapeHtml(item.assigneesOnLeave.join(', ')) + '</div>'
      : '';
    return (
      '<div class="ui-card p-4 mt-2">' +
        '<div class="flex items-baseline gap-2">' +
          '<span class="text-xs font-bold text-primary shrink-0">' + escapeHtml(item.time || 'ทั้งวัน') + '</span>' +
          '<span class="text-sm font-bold text-slate-800 min-w-0">' + escapeHtml(item.title) + '</span>' +
        '</div>' + subRows + onLeaveNote +
      '</div>'
    );
  }

  // ปฏิทินย่อของเดือนที่ดู: จุดเขียว = มีงาน / จุดอำพัน = มีผู้ลา (เฉพาะโหมดเจ้าหน้าที่)
  // วันที่มีรายการเป็นปุ่ม — แตะแล้วเลื่อนลิสต์ไปหา (section รายวันมี id d-YYYY-MM-DD)
  function renderMiniCalendar(byDate, leavesByDate, dates) {
    const [y, m] = state.month.split('-').map(Number);
    const firstDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(); // 0 = อาทิตย์ (คอลัมน์แรก)
    const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const has = {};
    dates.forEach(d => {
      has[d] = { work: !!(byDate[d] || []).length, leave: !!(leavesByDate[d] || []).length };
    });
    let cells = '';
    for (let i = 0; i < firstDow; i++) cells += '<div aria-hidden="true"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const date = state.month + '-' + pad(d);
      const info = has[date];
      const isToday = date === state.today;
      const num = '<span class="text-[11px] leading-none">' + d + '</span>';
      const dots = info
        ? '<span class="flex gap-0.5 justify-center mt-0.5">' +
            (info.work ? '<span class="w-1 h-1 rounded-full bg-primary"></span>' : '') +
            (info.leave ? '<span class="w-1 h-1 rounded-full bg-amber-500"></span>' : '') +
          '</span>'
        : '<span class="mt-0.5 block h-1"></span>'; // วันว่างก็เว้นแถวจุดไว้ให้สูงเท่ากัน
      cells += info
        ? '<button type="button" data-scroll="' + date + '" aria-label="' + escapeHtml(dayLabel(date)) + ' มีรายการ" ' +
            'class="flex flex-col items-center justify-center rounded-control h-9 ' +
              (isToday ? 'bg-brand-soft font-bold text-brand-strong' : 'hover:bg-slate-50') + '">' +
            num + dots + '</button>'
        : '<div class="flex flex-col items-center justify-center h-9 text-slate-300' +
            (isToday ? ' font-bold text-slate-500' : '') + '">' + num + dots + '</div>';
    }
    $('miniCal').innerHTML =
      '<div class="grid grid-cols-7 gap-0.5 text-center text-[10px] font-semibold text-slate-400 mb-1">' +
        THAI_DAYS_SHORT.map(d => '<div>' + d + '</div>').join('') + '</div>' +
      '<div class="grid grid-cols-7 gap-0.5">' + cells + '</div>';
  }

  function renderMonth(data) {
    showStatus('none');
    // กรอง "งานของฉัน": เหลือเฉพาะงานที่ผู้ดูรับผิดชอบ + ใบลาของผู้ดูเอง (กรองตอนแสดงผล
    // จากข้อมูลเดิมใน cache — สลับเปิด/ปิดได้ทันทีไม่ต้องดึงใหม่)
    const filtering = state.full && state.mine && state.viewer;
    const items = (data.items || []).filter(item => !filtering || isMine(item));
    const leaves = (data.leaves || []).filter(row => !filtering || row.name === state.viewer);
    const byDate = {};
    items.forEach(item => {
      (byDate[item.date] = byDate[item.date] || []).push(item);
    });
    // ผู้ลาถูกส่งมาเฉพาะมุมมองเจ้าหน้าที่ — วันที่มีแต่คนลาไม่มีงานก็ต้องมีหัวข้อวันโผล่ด้วย
    const leavesByDate = {};
    if (state.full) {
      leaves.forEach(row => {
        (leavesByDate[row.date] = leavesByDate[row.date] || []).push(row);
      });
    }
    const dates = Object.keys(Object.assign({}, byDate, leavesByDate)).sort();
    renderMiniCalendar(byDate, leavesByDate, dates);

    const html = dates.length
      ? dates.map(date => {
          const isToday = date === state.today;
          return (
            '<section class="mb-4" id="d-' + date + '">' +
              '<div class="flex items-center gap-2 mb-1 px-1">' +
                '<h2 class="text-sm font-bold ' + (isToday ? 'text-primary' : 'text-slate-600') + '">' +
                  escapeHtml(dayLabel(date)) + '</h2>' +
                (isToday ? '<span class="px-2 py-0.5 rounded-full bg-primary text-white text-[10px] font-bold">วันนี้</span>' : '') +
              '</div>' +
              (byDate[date] || []).map(itemCard).join('') +
              (leavesByDate[date] || []).map(leaveCard).join('') +
            '</section>'
          );
        }).join('')
      : '<p class="py-12 text-center text-slate-400 text-sm">' +
          (filtering ? 'ไม่มีงานที่คุณรับผิดชอบในเดือนนี้' : 'ยังไม่มีรายการในเดือนนี้') + '</p>';

    $('viewList').innerHTML = html;

    // เดือนปัจจุบัน → เลื่อนไปวันนี้ (หรือวันทำการถัดไป) ให้เอง
    if (state.month === todayMonth()) {
      const anchor = dates.find(d => d >= state.today) || dates[dates.length - 1];
      if (anchor && anchor !== dates[0]) {
        const el = $('viewList').querySelector('section:nth-of-type(' + (dates.indexOf(anchor) + 1) + ')');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  }

  // ชิปกรอง "งานของฉัน": โชว์เฉพาะโหมดเจ้าหน้าที่ที่รู้ชื่อผู้ดู สถานะกด/หน้าตาอิง state.mine
  function syncMineChip() {
    $('mineBar').classList.toggle('hidden', !(state.full && state.viewer));
    const btn = $('btnMine');
    btn.setAttribute('aria-pressed', state.mine ? 'true' : 'false');
    btn.className = (state.mine ? 'ui-btn-primary' : 'ui-btn-soft') + ' w-full';
    btn.textContent = (state.mine ? '✓ ' : '') + 'เฉพาะงานที่ฉันรับผิดชอบ';
  }

  function updateModeBadge(data) {
    state.full = !!data.full;
    state.viewer = data.viewer || '';
    if (data.viewMonths) state.viewMonths = data.viewMonths; // วงดูตามโหมดจากเซิร์ฟเวอร์ (source of truth เดียว)
    if (!state.full) state.mine = false; // หลุดโหมดเจ้าหน้าที่ (token หมดอายุ) → ยกเลิกกรองไปด้วย
    const badge = $('modeBadge');
    if (state.full) {
      badge.textContent = '✓ มุมมองเจ้าหน้าที่';
        badge.className = 'ui-badge ui-badge-success mt-2';
    } else {
      badge.textContent = 'มุมมองทั่วไป';
      badge.className = 'ui-badge ui-badge-neutral mt-2';
    }
    // ปุ่มล็อกอินโชว์เฉพาะ: ไม่เต็มโหมด + มี LIFF ของหน้านี้ให้ล็อกอิน
    $('loginCta').classList.toggle('hidden', state.full || !state.liffReady);
    syncMineChip();
  }

  // LIFF init สำเร็จทีหลัง (หน้าเดินต่อแบบสาธารณะไปก่อนตอน init เกิน 5 วินาที) — ปลุก UI ทันที:
  // โชว์ปุ่มล็อกอิน/ป้ายโหมดใหม่จากข้อมูลที่แคชไว้แล้ว ไม่ต้องรอผู้ใช้เปลี่ยนเดือนถึงจะเห็น
  // (ชุดข้อมูลแรกของเคสนี้ถูกแคชใต้ _pub และ cacheKey() พลิกเป็น _full ทันทีที่ liffReady — เจาะ _pub ก่อน)
  // ไม่ยิง API จากที่นี่: ถ้า loadMonth กำลังวิ่งอยู่ ตัวมันเรียก updateModeBadge เองเมื่อเสร็จ
  // (ตอนนั้น liffReady แล้ว) — เรียกซ้อนจากที่นี่จะเสี่ยง loadMonth ชนกัน
  function wakeLiffReady_() {
    state.liffReady = true;
    const data = state.cache[state.month + '_pub'] || state.cache[cacheKey(state.month)];
    if (data) { updateModeBadge(data); renderMonth(data); }
  }

  // เดือนอยู่ในวงที่เซิร์ฟเวอร์ให้ดูไหม (มิเรอร์ scheduleMonthAllowed_ — เงื่อนไขเดียวกับปุ่มนำทาง)
  function monthAllowed(month) {
    const bounds = viewBounds();
    const diff = monthDiff(todayMonth(), month);
    return diff >= bounds.back && diff <= bounds.fwd;
  }

  // ---------- รายการเลือกเดือน (แตะชื่อเดือนตรงกลาง) ----------

  // เดือนที่ระบบให้ดูทั้งหมด — ตามวงของโหมดปัจจุบันที่เซิร์ฟเวอร์ส่งมา (สาธารณะ -1/+6, เจ้าหน้าที่ ±12)
  function allowedMonths() {
    const bounds = viewBounds();
    const list = [];
    for (let d = bounds.back; d <= bounds.fwd; d++) list.push(shiftMonth(todayMonth(), d));
    return list;
  }

  // โหมดเจ้าหน้าที่มีรายการยาวข้ามปี — แทรกหัวข้อปี (พ.ศ.) คั่นทุกครั้งที่เปลี่ยนปี
  function renderMonthPicker() {
    const todayM = todayMonth();
    let lastYear = null;
    const parts = [];
    allowedMonths().forEach(m => {
      const yearBE = Number(m.slice(0, 4)) + 543;
      if (yearBE !== lastYear) {
        parts.push('<div class="px-3 pt-2 pb-1 text-xs font-bold text-slate-400">ปี ' + yearBE + '</div>');
        lastYear = yearBE;
      }
      const viewing = m === state.month;
      parts.push(
        '<button type="button" data-month="' + m + '" class="w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-control text-sm ' +
          (viewing ? 'bg-brand-soft font-bold text-brand-strong' : 'text-slate-700 hover:bg-slate-50') + '">' +
          '<span class="whitespace-nowrap">' + monthLabel(m) + '</span>' +
          '<span class="flex items-center gap-1.5 shrink-0">' +
            (m === todayM ? '<span class="text-[10px] font-bold text-white bg-primary rounded-full px-2 py-0.5">เดือนนี้</span>' : '') +
            (viewing ? '<span aria-hidden="true" class="text-brand-strong">✓</span>' : '') +
          '</span>' +
        '</button>'
      );
    });
    $('monthPicker').innerHTML = parts.join('');
  }

  // เปิด/ปิดรายการเดือน (ไม่ส่งค่า = สลับ) — เปิดใหม่ทุกครั้งเพราะเดือนที่ดูอยู่/เดือนปัจจุบันเปลี่ยนได้
  function toggleMonthPicker(open) {
    const willOpen = open == null ? $('monthPicker').classList.contains('hidden') : open;
    $('monthPicker').classList.toggle('hidden', !willOpen);
    $('btnMonth').setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    if (willOpen) renderMonthPicker();
  }

  // โหลดเดือนก่อนหน้า/ถัดไปล่วงหน้าแบบเงียบๆ หลังแสดงผลเดือนปัจจุบันเสร็จ
  // ให้กดไป-กลับได้ทันทีจาก cache (ล้มเหลวก็ไม่เป็นไร — กดปุ่มปกติจะดึงเอง)
  function prefetchNeighbors(month) {
    [shiftMonth(month, -1), shiftMonth(month, 1)].forEach(m => {
      if (monthAllowed(m) && !state.cache[cacheKey(m)]) fetchMonth(m).catch(function () {});
    });
  }

  async function loadMonth(month) {
    state.today = todayStr(); // คำนวณใหม่ทุกครั้ง — เปิดค้างข้ามเที่ยงคืนแล้วป้าย "วันนี้"/จุด scroll ต้องตามเวลาจริง
    state.month = month;
    toggleMonthPicker(false);
    $('monthLabel').textContent = monthLabel(month);
    updateNavState(true); // ปุ่มทุกปุ่มหรี่ลงทันทีที่เริ่มโหลด — เห็นชัดว่าคำสั่งถูกรับแล้ว
    showStatus('loading');
    try {
      const data = await fetchMonth(month);
      updateModeBadge(data);
      renderMonth(data);
      prefetchNeighbors(month);
    } catch (err) {
      $('errorMessage').textContent = err.message || 'เกิดข้อผิดพลาด';
      showStatus('error');
    } finally {
      updateNavState(false);
    }
  }

  // ---------- เริ่มทำงาน ----------

  async function boot() {
    // LIFF ของหน้านี้เป็นตัวเลือก: ยังไม่สร้าง (ค่าว่าง) ก็ทำงานแบบสาธารณะได้เลย
    // และไม่ใส่ withLoginOnExternalBrowser — หน้าสาธารณะต้องไม่ดันผู้ชมไปหน้า login ก่อนเห็นข้อมูล
    const liffId = (CONFIG.SCHEDULE_LIFF_ID || '').trim();
    if (liffId && liffId.indexOf('__') !== 0 && typeof liff !== 'undefined') {
      try {
        // จับเวลา init 5 วินาที — เคส init ค้าง (เคยเกิดกับหน้าฟอร์มลา) ต้องไม่ลากหน้าสาธารณะ
        // ให้ค้างตามไปด้วย: หมดเวลาแล้วเดินหน้าแบบสาธารณะก่อน แล้วปลุก liffReady เองเมื่อ init
        // สำเร็จทีหลัง (ตัวจับเวลาไม่ cancel การปลุก) — ปลุก UI ที่ค้างอยู่ด้วย (wakeLiffReady_)
        // คำขอเดือนถัดไปเลยใช้ token ได้โดยไม่ต้องรีเฟรชหน้า
        await Promise.race([
          liff.init({ liffId: liffId }).then(wakeLiffReady_, function () {}),
          new Promise(function (resolve) { setTimeout(resolve, 5000); }),
        ]);
      } catch (err) { /* LIFF พัง → ดูแบบสาธารณะ ไม่บล็อกเนื้อหา */ }
    }
    await loadMonth(todayMonth());
  }

  $('btnPrev').addEventListener('click', function () { loadMonth(shiftMonth(state.month, -1)); });
  $('btnNext').addEventListener('click', function () { loadMonth(shiftMonth(state.month, 1)); });
  // รีเฟรช: ล้างเฉพาะ cache "ฝั่งหน้าเว็บ" ของเดือนที่ดูอยู่แล้วดึงใหม่ — ไม่มีพารามิเตอร์ขอให้
  // เซิร์ฟเวอร์ข้าม cache ของเขา (กันถูกยิงรัวกระทบโควตา) ข้อมูลสดที่สุดที่ได้จึงเท่ากับ
  // อายุ cache ฝั่งเซิร์ฟเวอร์ (≤5 นาที) — ต้องการของสดกว่านั้นให้เป็นฟีเจอร์ฝั่งผู้ดูแลเท่านั้น
  $('btnRefresh').addEventListener('click', function () {
    delete state.cache[cacheKey(state.month)];
    loadMonth(state.month);
  });
  $('btnMonth').addEventListener('click', function () { toggleMonthPicker(); });
  $('monthPicker').addEventListener('click', function (e) {
    const btn = e.target.closest('[data-month]');
    if (!btn) return;
    toggleMonthPicker(false);
    if (btn.dataset.month !== state.month) loadMonth(btn.dataset.month); // เดือนเดิมไม่โหลดซ้ำ ปิดรายการอย่างเดียว
  });
  // แตะนอกรายการ = ปิด / กด Esc = ปิดแล้วคืน focus กลับที่ปุ่มชื่อเดือน
  document.addEventListener('click', function (e) {
    if (!$('monthPicker').classList.contains('hidden') &&
        !e.target.closest('#monthPicker') && !e.target.closest('#btnMonth')) toggleMonthPicker(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('monthPicker').classList.contains('hidden')) {
      toggleMonthPicker(false);
      $('btnMonth').focus();
    }
  });
  // แตะวันที่มีรายการในปฏิทินย่อ = เลื่อนลิสต์ไปหาวันนั้น
  $('miniCal').addEventListener('click', function (e) {
    const btn = e.target.closest('[data-scroll]');
    if (!btn) return;
    const el = document.getElementById('d-' + btn.dataset.scroll);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // ---------- ปัดนิ้วเปลี่ยนเดือน ----------
  // ปัดแนวนอน = เปลี่ยนเดือน (ต้องชัดกว่าแนวตั้งอย่างน้อย 1.5 เท่า กันขโมยการเลื่อนอ่านลิสต์)
  // ยึดสถานะ disabled ของปุ่ม ‹ › เป็นเงื่อนไข — มันรวม "กำลังโหลด" และ "ชนขอบเขตเดือน" ไว้แล้ว
  const SWIPE_MIN_PX = 60;
  let touchStart = null;
  document.addEventListener('touchstart', function (e) {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const forward = dx < 0;
    if ($(forward ? 'btnNext' : 'btnPrev').disabled) return;
    loadMonth(shiftMonth(state.month, forward ? 1 : -1));
  }, { passive: true });
  $('btnMine').addEventListener('click', function () {
    state.mine = !state.mine;
    syncMineChip();
    const data = state.cache[cacheKey(state.month)];
    if (data) renderMonth(data); // กรองจากข้อมูลที่โหลดแล้ว ไม่ยิง API ซ้ำ
  });
  $('btnRetry').addEventListener('click', function () { location.replace(location.origin + location.pathname); });
  $('btnLogin').addEventListener('click', function () {
    this.disabled = true;
    this.textContent = 'กำลังเชื่อมต่อ LINE…';
    // ในแอป LINE ห้ามเรียก liff.login() (เอกสาร LINE) — รีโหลดให้ init ออก token ใหม่แทน
    if (typeof liff.isInClient === 'function' && liff.isInClient()) { location.reload(); return; }
    try {
      if (liff.isLoggedIn()) liff.logout(); // token เก่าหมดอายุ → ล้างก่อนขอใหม่
      liff.login();
    } catch (err) {
      location.reload(); // init ยังไม่พร้อม (เคส init ค้าง) — โหลดหน้าใหม่ให้เริ่มใหม่ทั้งหมด
    }
  });

  boot();
})();
</script>
