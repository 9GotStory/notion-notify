<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งเตือนปฏิทิน — หน้าผู้ดูแล</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- CSS ชุดเดียวกับฟอร์มลา/ตารางงาน — คอมไพล์โดย GitHub Actions (ไม่ใช้ Tailwind CDN ที่มีปัญหาเครือข่ายองค์กร) -->
<link rel="stylesheet" href="../liff-form/styles.css">
</head>
<body class="font-sans bg-canvas text-slate-900 text-[15px] leading-relaxed">

  <!-- ===== หน้า login (แสดงก่อนเมื่อยังไม่มี token) ===== -->
  <div id="loginView" class="hidden min-h-screen flex items-center justify-center px-4">
    <div class="ui-card w-full max-w-sm p-6">
      <h1 class="text-lg font-semibold mb-1">📅 ระบบแจ้งเตือนปฏิทิน</h1>
      <p class="text-sm text-slate-500 mb-5">หน้าจัดการสำหรับผู้ดูแลระบบ — กรอก token เพื่อเข้าใช้งาน (เก็บไว้ในเครื่องนี้จนกว่าจะออกจากระบบ)</p>
      <label for="tokenInput" class="ui-label">Token ผู้ดูแล</label>
      <input id="tokenInput" type="password" autocomplete="off" spellcheck="false"
             class="ui-field font-mono"
             placeholder="วาง token ที่ได้รับจากผู้ดูแลระบบ">
      <p id="loginError" class="ui-alert ui-alert-danger hidden mt-2"></p>
      <button id="loginBtn" type="button"
              class="ui-btn-primary w-full mt-4">
        เข้าสู่ระบบ
      </button>
    </div>
  </div>

  <!-- ===== โครงหลัก (แสดงหลังตรวจ token ผ่าน) ===== -->
  <div id="appShell" class="hidden">
    <header class="bg-primary text-white">
      <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
        <h1 class="text-lg font-semibold">📅 ระบบแจ้งเตือนปฏิทิน</h1>
        <button id="logoutBtn" type="button"
                class="text-sm text-white/85 hover:text-white underline underline-offset-2">
          ออกจากระบบ
        </button>
      </div>
    </header>

    <div class="max-w-3xl mx-auto px-4 py-5 pb-16">
      <nav class="ui-card flex gap-1 p-1 mb-5 overflow-x-auto" aria-label="เมนูผู้ดูแล">
        <button type="button" data-route="overview" class="nav-btn flex-1 min-h-11 min-w-[72px] py-2.5 px-2 rounded-lg text-sm font-medium text-slate-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary">ภาพรวม</button>
        <button type="button" data-route="staff" class="nav-btn flex-1 min-h-11 min-w-[72px] py-2.5 px-2 rounded-lg text-sm font-medium text-slate-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary">บุคลากร</button>
        <button type="button" data-route="leave" class="nav-btn flex-1 min-h-11 min-w-[72px] py-2.5 px-2 rounded-lg text-sm font-medium text-slate-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary">สิทธิ์วันลา</button>
        <button type="button" data-route="leave-manage" class="nav-btn flex-1 min-h-11 min-w-[82px] py-2.5 px-2 rounded-lg text-sm font-medium text-slate-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary">จัดการใบลา</button>
        <button type="button" data-route="holidays" class="nav-btn flex-1 min-h-11 min-w-[72px] py-2.5 px-2 rounded-lg text-sm font-medium text-slate-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary">วันหยุด</button>
        <button type="button" data-route="reports" class="nav-btn flex-1 min-h-11 min-w-[72px] py-2.5 px-2 rounded-lg text-sm font-medium text-slate-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary">รายงาน</button>
        <button type="button" data-route="system" class="nav-btn flex-1 min-h-11 min-w-[72px] py-2.5 px-2 rounded-lg text-sm font-medium text-slate-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary">ระบบ</button>
      </nav>

      <main id="view" aria-live="polite"></main>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2.5 rounded-lg opacity-0 pointer-events-none transition-opacity motion-reduce:transition-none max-w-[calc(100%-2rem)] text-center"></div>

  <!-- ลำดับสำคัญ: ชั้นพื้นฐานก่อน views และ app.js ท้ายสุด (เป็นผู้ consume ทุกอย่าง) -->
  <script src="../shared/date.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/staff.js"></script>
  <script src="js/views/leave.js"></script>
  <script src="js/views/leave-manage.js"></script>
  <script src="js/views/holidays.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/system.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
