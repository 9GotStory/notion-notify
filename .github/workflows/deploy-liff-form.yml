# Deploy หน้าฟอร์ม LIFF ขึ้น GitHub Pages โดยแทนที่ placeholder ด้วยค่าจาก GitHub Environment
#
# ค่า LIFF_ID / API_URL ไม่ถูก commit ลง repo — เก็บไว้ใน GitHub Environment ชื่อ "liff"
# เป็น "secret" หรือ "variable" ก็ได้ (workflow อ่าน secret ก่อน ถ้าไม่มีค่อยอ่าน variable):
#   - secret   = ถูก mask ใน log แต่เปิดดูค่าซ้ำไม่ได้ — เหมาะกับเจตนา "ความปลอดภัย"
#   - variable = เปิดดู/แก้ค่าได้ตลอด — เหมาะถ้ามองว่าเป็น config ธรรมดา
#   (สองค่านี้ public-safe by design — ถูกส่งไป browser ผู้ใช้อยู่แล้ว ต่างกันแค่การ mask ใน log)
#
# workflow จะแทนที่ __LIFF_ID__ / __API_URL__ ใน web/liff-form/index.html ก่อนเสิร์ฟขึ้น Pages
# (URL ปัจจุบัน .../notion-notify/web/liff-form/) และเสิร์ฟเฉพาะหน้าเว็บ ไม่โฮสต์ไฟล์ .gs ทั้ง repo
#
# ต้องตั้งค่าครั้งเดียว: Settings > Pages > Source: "GitHub Actions"
# (ถ้ายังเป็น "Deploy from a branch" workflow นี้จะ deploy ไม่ได้)

name: Deploy LIFF form

on:
  push:
    branches: [main]
    paths:
      - 'web/liff-form/**'
      - 'web/schedule/**'
      - '.github/workflows/deploy-liff-form.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: liff
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # ผ่านค่าผ่าน env แทนการแทนที่ตรงๆ ใน shell — กัน script injection จากค่า secret
      - name: Build site (แทนที่ placeholder ด้วยค่าจาก Environment)
        env:
          LIFF_ID: ${{ secrets.LIFF_ID || vars.LIFF_ID }}
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
          SCHEDULE_LIFF_ID: ${{ secrets.SCHEDULE_LIFF_ID || vars.SCHEDULE_LIFF_ID }}
        run: |
          if [ -z "$LIFF_ID" ] || [ -z "$API_URL" ]; then
            echo "::error::ยังไม่ได้ตั้งค่า — ไปที่ Settings > Environments > liff แล้วเพิ่ม LIFF_ID และ API_URL (เป็น secret หรือ variable ก็ได้)"
            exit 1
          fi
          mkdir -p site/web/liff-form
          cp web/liff-form/index.html site/web/liff-form/index.html
          # ตราหน่วยงานสำหรับหน้า loading — คัดลอกเฉพาะเมื่อมีไฟล์ (ไม่มีก็ไม่พัง หน้าเว็บ fallback เป็นตรา "สสอ.")
          if [ -f web/liff-form/logo.png ]; then cp web/liff-form/logo.png site/web/liff-form/logo.png; fi
          # ดาวน์โหลด LIFF SDK มาเสิร์ฟ same-origin — เครือข่ายองค์กรบางแห่ง reset การเชื่อมต่อ
          # ไป static.line-scdn.net เหมือนที่เคยเจอกับ cdn.tailwindcss.com (ตัว runner ของ GitHub เข้าถึงได้ปกติ)
          # ปักเวอร์ชันเดียว (แทน edge/2 ล่าสุดอัตโนมัติ) เพื่อให้พฤติกรรม login/token นิ่งระยะยาว
          # ไม่โดน breaking change ที่ปล่อยมาเงียบๆ — จะอัปเกรดให้แก้เลขเวอร์ชันตรงนี้จุดเดียว
          # (เช็ครุ่นล่าสุดได้ที่ https://developers.line.biz/en/reference/liff/ )
          curl -fsSL "https://static.line-scdn.net/liff/edge/versions/2.30.0/sdk.js" -o site/web/liff-form/sdk.js
          if [ ! -s site/web/liff-form/sdk.js ]; then
            echo "::error::ดาวน์โหลด LIFF SDK ไม่สำเร็จ"
            exit 1
          fi
          # คอมไพล์ Tailwind v4 เป็น CSS same-origin — หน้าเว็บไม่พึ่ง CDN ภายนอก
          # (เครือข่ายองค์กรบางแห่ง reset การเชื่อมต่อไป cdn.tailwindcss.com)
          # ระวังพาร์ธ output: รันจากใน web/liff-form — ขึ้น 2 ชั้นถึง root ของ repo จึงต้อง ../../site/...
          cd web/liff-form
          npm ci --no-fund --no-audit
          npx @tailwindcss/cli -i src/styles.css -o ../../site/web/liff-form/styles.css --minify
          cd ../..
          if [ ! -s site/web/liff-form/styles.css ]; then
            echo "::error::คอมไพล์ CSS ไม่สำเร็จ"
            exit 1
          fi
          sed -i "s|__LIFF_ID__|$LIFF_ID|g; s|__API_URL__|$API_URL|g" site/web/liff-form/index.html
          if grep -q '__LIFF_ID__\|__API_URL__' site/web/liff-form/index.html; then
            echo "::error::ยังมี placeholder ค้างในไฟล์"
            exit 1
          fi
          # หน้าตารางงาน /web/schedule/ — ใช้ CSS/SDK/โลโก้ชุดเดียวกับฟอร์มลา
          # SCHEDULE_LIFF_ID เป็นตัวเลือก: ยังไม่ได้สร้าง LIFF ตัวที่สองก็ deploy ได้ (ทำงานโหมดสาธารณะล้วน)
          mkdir -p site/web/schedule
          cp web/schedule/index.html site/web/schedule/index.html
          sed -i "s|__SCHEDULE_LIFF_ID__|${SCHEDULE_LIFF_ID:-}|g; s|__API_URL__|$API_URL|g" site/web/schedule/index.html
          echo "deploy หน้าฟอร์ม + ตารางงานพร้อมแล้ว (ค่า secret ถูก mask โดย GitHub)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
