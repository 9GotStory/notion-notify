# Deploy หน้าฟอร์ม LIFF ขึ้น GitHub Pages โดยแทนที่ placeholder ด้วยค่าจาก GitHub Environment
#
# ค่า LIFF_ID / API_URL ไม่ถูก commit ลง repo — เก็บไว้ใน GitHub Environment ชื่อ "liff"
# เป็น "secret" หรือ "variable" ก็ได้ (workflow อ่าน secret ก่อน ถ้าไม่มีค่อยอ่าน variable):
#   - secret   = ถูก mask ใน log แต่เปิดดูค่าซ้ำไม่ได้ — เหมาะกับเจตนา "ความปลอดภัย"
#   - variable = เปิดดู/แก้ค่าได้ตลอด — เหมาะถ้ามองว่าเป็น config ธรรมดา
#   (สองค่านี้ public-safe by design — ถูกส่งไป browser ผู้ใช้อยู่แล้ว ต่างกันแค่การ mask ใน log)
#
# workflow จะแทนที่ __LIFF_ID__ / __API_URL__ ใน liff-form/index.html ก่อนเสิร์ฟขึ้น Pages
# (URL เดิม .../notion-notify/liff-form/) และเสิร์ฟเฉพาะหน้าฟอร์ม ไม่โฮสต์ไฟล์ .gs ทั้ง repo
#
# ต้องตั้งค่าครั้งเดียว: Settings > Pages > Source: "GitHub Actions"
# (ถ้ายังเป็น "Deploy from a branch" workflow นี้จะ deploy ไม่ได้)

name: Deploy LIFF form

on:
  push:
    branches: [main]
    paths:
      - 'liff-form/**'
      - '.github/workflows/deploy-liff-form.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: liff
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # ผ่านค่าผ่าน env แทนการแทนที่ตรงๆ ใน shell — กัน script injection จากค่า secret
      - name: Build site (แทนที่ placeholder ด้วยค่าจาก Environment)
        env:
          LIFF_ID: ${{ secrets.LIFF_ID || vars.LIFF_ID }}
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
        run: |
          if [ -z "$LIFF_ID" ] || [ -z "$API_URL" ]; then
            echo "::error::ยังไม่ได้ตั้งค่า — ไปที่ Settings > Environments > liff แล้วเพิ่ม LIFF_ID และ API_URL (เป็น secret หรือ variable ก็ได้)"
            exit 1
          fi
          mkdir -p site/liff-form
          cp liff-form/index.html site/liff-form/index.html
          sed -i "s|__LIFF_ID__|$LIFF_ID|g; s|__API_URL__|$API_URL|g" site/liff-form/index.html
          if grep -q '__LIFF_ID__\|__API_URL__' site/liff-form/index.html; then
            echo "::error::ยังมี placeholder ค้างในไฟล์"
            exit 1
          fi
          echo "deploy หน้าฟอร์มพร้อมแล้ว (ค่า secret ถูก mask โดย GitHub)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
