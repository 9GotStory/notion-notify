# Deploy หน้าเว็บขึ้น GitHub Pages โดยแทนที่ placeholder ด้วยค่าจาก GitHub Environment
#
# ค่า LIFF_ID / GATEWAY_URL ไม่ถูก commit ลง repo — เก็บไว้ใน GitHub Environment ชื่อ "liff"
# เป็น "secret" หรือ "variable" ก็ได้ (workflow อ่าน secret ก่อน ถ้าไม่มีค่อยอ่าน variable):
#   - secret   = ถูก mask ใน log แต่เปิดดูค่าซ้ำไม่ได้ — เหมาะกับเจตนา "ความปลอดภัย"
#   - variable = เปิดดู/แก้ค่าได้ตลอด — เหมาะถ้ามองว่าเป็น config ธรรมดา
#   (ทั้งหมด public-safe by design — ถูกส่งไป browser ผู้ใช้อยู่แล้ว ต่างกันแค่การ mask ใน log;
#    ADMIN_TOKEN ของหน้าผู้ดูแล "ไม่ได้" อยู่ตรงนี้ — ผู้ดูแลพิมพ์เองและเก็บใน sessionStorage เท่านั้น)
#
# workflow จะแทนที่ __LIFF_ID__ และ URL ของ security gateway ในหน้าเว็บทั้งสามส่วน
# ก่อนเสิร์ฟขึ้น Pages (URL ปัจจุบัน .../notion-notify/web/liff-form/) และเสิร์ฟเฉพาะหน้าเว็บ ไม่โฮสต์ไฟล์ .gs ทั้ง repo
#
# ต้องตั้งค่าครั้งเดียว: Settings > Pages > Source: "GitHub Actions"
# (ถ้ายังเป็น "Deploy from a branch" workflow นี้จะ deploy ไม่ได้)

name: Deploy web pages

on:
  push:
    branches: [main]
    paths:
      - 'web/liff-form/**'
      - 'web/schedule/**'
      - 'web/admin/**'
      - '.github/workflows/deploy-liff-form.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: liff
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/configure-pages@v6

      - name: Run Apps Script unit tests
        run: node scripts/test-apps-script.js

      - name: Run security gateway tests
        working-directory: gateway
        run: npm test

      - name: Check Apps Script and inline browser syntax
        run: node scripts/check-syntax.js

      # ผ่านค่าผ่าน env แทนการแทนที่ตรงๆ ใน shell — กัน script injection จากค่า secret
      - name: Build site (แทนที่ placeholder ด้วยค่าจาก Environment)
        env:
          LIFF_ID: ${{ secrets.LIFF_ID || vars.LIFF_ID }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || vars.GATEWAY_URL }}
          SCHEDULE_LIFF_ID: ${{ secrets.SCHEDULE_LIFF_ID || vars.SCHEDULE_LIFF_ID }}
        run: |
          if [ -z "$LIFF_ID" ] || [ -z "$GATEWAY_URL" ]; then
            echo "::error::ยังไม่ได้ตั้งค่า — ไปที่ Settings > Environments > liff แล้วเพิ่ม LIFF_ID และ GATEWAY_URL"
            exit 1
          fi
          if [[ ! "$LIFF_ID" =~ ^[0-9]+-[A-Za-z0-9]+$ ]]; then
            echo "::error::LIFF_ID มีรูปแบบไม่ถูกต้อง"
            exit 1
          fi
          if [ -n "$SCHEDULE_LIFF_ID" ] && [[ ! "$SCHEDULE_LIFF_ID" =~ ^[0-9]+-[A-Za-z0-9]+$ ]]; then
            echo "::error::SCHEDULE_LIFF_ID มีรูปแบบไม่ถูกต้อง"
            exit 1
          fi
          if [[ ! "$GATEWAY_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]; then
            echo "::error::GATEWAY_URL ต้องเป็น HTTPS base URL ที่ไม่มี path/query"
            exit 1
          fi
          mkdir -p site/web/liff-form
          cp web/liff-form/index.html site/web/liff-form/index.html
          # ตราหน่วยงานสำหรับหน้า loading — คัดลอกเฉพาะเมื่อมีไฟล์ (ไม่มีก็ไม่พัง หน้าเว็บ fallback เป็นตรา "สสอ.")
          if [ -f web/liff-form/logo.png ]; then cp web/liff-form/logo.png site/web/liff-form/logo.png; fi
          # ดาวน์โหลด LIFF SDK มาเสิร์ฟ same-origin — เครือข่ายองค์กรบางแห่ง reset การเชื่อมต่อ
          # ไป static.line-scdn.net เหมือนที่เคยเจอกับ cdn.tailwindcss.com (ตัว runner ของ GitHub เข้าถึงได้ปกติ)
          # ปักเวอร์ชันเดียว (แทน edge/2 ล่าสุดอัตโนมัติ) เพื่อให้พฤติกรรม login/token นิ่งระยะยาว
          # ไม่โดน breaking change ที่ปล่อยมาเงียบๆ — จะอัปเกรดให้แก้เลขเวอร์ชันตรงนี้จุดเดียว
          # (เช็ครุ่นล่าสุดได้ที่ https://developers.line.biz/en/reference/liff/ )
          curl -fsSL "https://static.line-scdn.net/liff/edge/versions/2.30.0/sdk.js" -o site/web/liff-form/sdk.js
          if [ ! -s site/web/liff-form/sdk.js ]; then
            echo "::error::ดาวน์โหลด LIFF SDK ไม่สำเร็จ"
            exit 1
          fi
          # คอมไพล์ Tailwind v4 เป็น CSS same-origin — หน้าเว็บไม่พึ่ง CDN ภายนอก
          # (เครือข่ายองค์กรบางแห่ง reset การเชื่อมต่อไป cdn.tailwindcss.com)
          # ระวังพาร์ธ output: รันจากใน web/liff-form — ขึ้น 2 ชั้นถึง root ของ repo จึงต้อง ../../site/...
          cd web/liff-form
          npm ci --no-fund --no-audit
          npx @tailwindcss/cli -i src/styles.css -o ../../site/web/liff-form/styles.css --minify
          cd ../..
          if [ ! -s site/web/liff-form/styles.css ]; then
            echo "::error::คอมไพล์ CSS ไม่สำเร็จ"
            exit 1
          fi
          sed -i "s|__LIFF_ID__|$LIFF_ID|g; s|__API_URL__|$GATEWAY_URL|g" site/web/liff-form/index.html
          if grep -q '__LIFF_ID__\|__API_URL__' site/web/liff-form/index.html; then
            echo "::error::ยังมี placeholder ค้างในไฟล์"
            exit 1
          fi
          # หน้าตารางงาน /web/schedule/ — ใช้ CSS/SDK/โลโก้ชุดเดียวกับฟอร์มลา
          # SCHEDULE_LIFF_ID เป็นตัวเลือก: ยังไม่ได้สร้าง LIFF ตัวที่สองก็ deploy ได้ (ทำงานโหมดสาธารณะล้วน)
          mkdir -p site/web/schedule
          cp web/schedule/index.html site/web/schedule/index.html
          sed -i "s|__SCHEDULE_LIFF_ID__|${SCHEDULE_LIFF_ID:-}|g; s|__API_URL__|$GATEWAY_URL|g" site/web/schedule/index.html
          # หน้าผู้ดูแล /web/admin/ — SPA ไฟล์เปล่า (ไม่มี build ของตัวเอง) ใช้ CSS ชุดเดียวกัน
          # token ผู้ดูแลไม่ผ่านทางนี้ — ผู้ดูแลพิมพ์เองในหน้าเว็บ จึงแทนเฉพาะ URL ของ gateway
          mkdir -p site/web/admin/js/views
          cp web/admin/index.html site/web/admin/index.html
          cp web/admin/js/*.js site/web/admin/js/
          cp web/admin/js/views/*.js site/web/admin/js/views/
          sed -i "s|__ADMIN_API_URL__|$GATEWAY_URL|g" site/web/admin/js/api.js
          if grep -rq '__ADMIN_API_URL__' site/web/admin/; then
            echo "::error::ยังมี placeholder __ADMIN_API_URL__ ค้างในไฟล์"
            exit 1
          fi
          echo "deploy หน้าฟอร์ม + ตารางงาน + หน้าผู้ดูแลพร้อมแล้ว (ค่า secret ถูก mask โดย GitHub)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
