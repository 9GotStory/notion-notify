name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run Apps Script regression tests
        run: node scripts/test-apps-script.js
      - name: Run security gateway tests
        working-directory: gateway
        run: npm test
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.js
